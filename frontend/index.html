<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>IronCRM</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <nav id="sidebar">
      <div class="brand-block">
        <div class="brand-topline">
          <div>
            <div class="logo">Iron<span>CRM</span></div>
            <div class="logo-meta">Portable CRM workspace</div>
          </div>
          <button id="sidebar-toggle" class="icon-btn" type="button" aria-label="Collapse sidebar"><span class="icon icon-collapse"></span></button>
        </div>
      </div>

      <div class="sidebar-section">
        <div class="section-label">Workspace</div>
        <div id="sidebar-overview" class="overview-list"></div>
      </div>

      <div class="sidebar-section sidebar-grow">
        <div class="section-label">Modules</div>
        <div id="module-list"></div>
      </div>

      <div class="sidebar-footer">
        <span id="db-status">● local</span>
        <span id="sync-status">offline-first</span>
      </div>
    </nav>

    <main id="content">
      <header id="toolbar">
        <div class="toolbar-primary">
          <div>
            <div id="view-eyebrow">Workspace</div>
            <h1 id="view-title">Dashboard</h1>
          </div>
          <div id="view-meta"></div>
        </div>

        <div class="toolbar-controls">
          <label class="search-shell">
            <span class="search-icon"><span class="icon icon-search"></span></span>
            <input id="global-search" type="search" placeholder="Search records, companies, people">
          </label>

          <div id="view-switcher" class="segmented-control"></div>

          <button class="tool-btn" type="button" data-action="export-workspace">Export</button>

          <div id="imports-control" class="imports-control">
            <button class="tool-btn" id="imports-btn" type="button" aria-haspopup="menu" aria-expanded="false">Imports</button>
            <div id="imports-menu" class="imports-menu hidden" role="menu" aria-label="Imports">
              <button type="button" class="imports-menu-item" data-action="open-suitecrm-wizard" role="menuitem">
                <span>SuiteCRM</span>
                <small>Detect, review, import, undo</small>
              </button>
              <button type="button" class="imports-menu-item" data-action="open-odoo-wizard" role="menuitem">
                <span>Odoo</span>
                <small>Sandbox, review, import, undo</small>
              </button>
              <button type="button" class="imports-menu-item" data-action="restore-workspace" role="menuitem">
                <span>Workspace file</span>
                <small>Load an IronCRM bundle</small>
              </button>
            </div>
          </div>

          <button class="tool-btn primary-btn" id="new-record-btn" type="button">New</button>
        </div>
      </header>

      <section id="workspace-shell">
        <section id="workspace">
          <div id="main-view">
            <div id="loading" class="hidden">Loading...</div>
            <div id="dashboard" class="workspace-pane hidden"></div>
            <div id="suitecrm-wizard" class="workspace-pane hidden"></div>
            <div id="table-view" class="workspace-pane hidden">
              <div class="table-shell">
                <table id="data-table">
                  <thead id="table-head"></thead>
                  <tbody id="table-body"></tbody>
                </table>
              </div>
            </div>
            <div id="board-view" class="hidden"></div>
            <div id="empty-state">
              <button id="empty-create-btn" class="empty-icon" type="button" aria-label="Create record">+</button>
              <h3>No records in view</h3>
              <p id="empty-state-copy">Choose a module, import data, or create a new record.</p>
            </div>
          </div>
        </section>

        <aside id="detail-pane" class="hidden">
          <div class="detail-pane-chrome">
            <div class="detail-pane-title">Record</div>
            <button id="detail-close" class="icon-btn" type="button" aria-label="Close detail panel"><span class="icon icon-close"></span></button>
          </div>

          <div id="detail-empty" class="detail-empty-state">
            <div class="detail-empty-icon">◎</div>
            <h3>Select a record</h3>
            <p>Review details, related records, and next actions without leaving the list.</p>
          </div>

          <div id="detail-content" class="hidden">
            <div id="detail-header"></div>
            <div id="detail-sections"></div>
          </div>
        </aside>
      </section>
    </main>
  </div>

  <div id="toast-region"></div>

  <script src="app.js"></script>
</body>
</html>
