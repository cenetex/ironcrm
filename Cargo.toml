[workspace]
members = ["src-tauri"]

[package]
name = "ironcrm"
version = "0.1.0"
edition = "2024"
description = "Rust-native CRM engine, compatible with SuiteCRM databases"

[features]
default = []
http-server = ["axum", "tower", "tower-http"]
scanner-module = ["tempfile"]

[dependencies]
# Async runtime
tokio = { version = "1", features = ["full"] }

# Database
sqlx = { version = "0.8", features = ["runtime-tokio", "mysql", "postgres", "sqlite", "migrate"] }

# HTTP server (optional, plugin-style)
axum = { version = "0.8", features = ["multipart"], optional = true }
tower = { version = "0.5", optional = true }
tower-http = { version = "0.6", features = ["cors", "trace", "fs"], optional = true }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
anyhow = "1"
thiserror = "2"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# SQLite (bundled)
libsqlite3-sys = { version = "0.30", features = ["bundled"] }

# Licensing / crypto
hex = "0.4"
rand = "0.8"
sha2 = "0.10"

# Utilities
chrono = { version = "0.4", features = ["serde"] }
tempfile = { version = "3", optional = true }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
tempfile = "3"
