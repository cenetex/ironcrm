services:
  odoo-db:
    image: postgres:16
    container_name: ironcrm-odoo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: odoo
      POSTGRES_PASSWORD: odoo
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - odoo_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U odoo -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 12

  odoo-init:
    image: odoo:18.0
    container_name: ironcrm-odoo-init
    depends_on:
      odoo-db:
        condition: service_healthy
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    command:
      - odoo
      - --database=odoo
      - --init=base,crm
      - --without-demo=False
      - --stop-after-init
      - --db_host=odoo-db
      - --db_port=5432
      - --db_user=odoo
      - --db_password=odoo
    volumes:
      - odoo_data:/var/lib/odoo
    restart: "no"

  odoo:
    image: odoo:18.0
    container_name: ironcrm-odoo
    restart: unless-stopped
    depends_on:
      odoo-db:
        condition: service_healthy
      odoo-init:
        condition: service_completed_successfully
    environment:
      HOST: odoo-db
      PORT: 5432
      USER: odoo
      PASSWORD: odoo
    ports:
      - "127.0.0.1:8069:8069"
    volumes:
      - odoo_data:/var/lib/odoo

volumes:
  odoo_db:
  odoo_data:
